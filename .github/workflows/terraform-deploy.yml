name: Terraform Deploy - Data Lake
run-name: >-
  ${{
    github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) ||
    github.event_name == 'workflow_dispatch' && format('Manual: {0} ({1})', github.event.inputs.environment, github.event.inputs.action) ||
    format('Deploy: {0}', github.ref_name)
  }}

on:
  push:
    branches: [main, develop, "feature/*", "release/*"]
    paths: ['modules/**', '.github/workflows/*.yml']
  pull_request:
    branches: [main, develop]
    paths: ['modules/**', '.github/workflows/*.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [dev, qa, prod]
      action:
        description: 'Action'
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      layer:
        description: 'Layer (empty = all)'
        required: false
        type: choice
        options: ['', raw, staging, business]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: eu-west-1
  TF_VERSION: '1.10.0'
  COMPANY_NAME: vigalcontec

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Detect Environment
  # ─────────────────────────────────────────────────────────────────────────────
  detect:
    name: Detect Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      env_upper: ${{ steps.env.outputs.env_upper }}
      layers: ${{ steps.layers.outputs.matrix }}
    steps:
      - name: Detect Environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            ENV="qa"
          else
            ENV="dev"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "env_upper=$(echo ${ENV} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Build Layer Matrix
        id: layers
        run: |
          LAYER="${{ github.event.inputs.layer }}"
          if [[ -z "$LAYER" || "$LAYER" == "all" ]]; then
            echo 'matrix=["raw","staging","business"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$LAYER\"]" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Validate All Modules
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        layer: [raw, staging, business]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Validate - ${{ matrix.layer }}
        run: terraform init -backend=false && terraform validate
        working-directory: ./modules/${{ matrix.layer }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: detect
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./modules
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Layers (Matrix)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy ${{ matrix.layer }}
    runs-on: ubuntu-latest
    needs: [detect, validate, security]
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        layer: ${{ fromJson(needs.detect.outputs.layers) }}
    env:
      ENV: ${{ needs.detect.outputs.environment }}
      LAYER: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', needs.detect.outputs.env_upper)] }}
          role-session-name: datalake-${{ matrix.layer }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Account ID
        id: aws
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Generate Backend Config
        run: |
          cat > backend.tf << EOF
          terraform {
            backend "s3" {
              bucket  = "tfstate-${{ env.COMPANY_NAME }}-${{ env.ENV }}-${{ steps.aws.outputs.account_id }}"
              key     = "datalake/${{ env.LAYER }}/terraform.tfstate"
              region  = "${{ env.AWS_REGION }}"
              encrypt = true
            }
          }
          EOF
        working-directory: ./modules/${{ env.LAYER }}

      - name: Generate tfvars
        run: |
          cat > terraform.tfvars << EOF
          environment  = "${{ env.ENV }}"
          company_name = "${{ env.COMPANY_NAME }}"
          aws_region   = "${{ env.AWS_REGION }}"
          tags = {
            Environment = "${{ env.ENV }}"
            Project     = "datalake"
            Layer       = "${{ env.LAYER }}"
            ManagedBy   = "terraform"
          }
          EOF
        working-directory: ./modules/${{ env.LAYER }}

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ./modules/${{ env.LAYER }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false
        working-directory: ./modules/${{ env.LAYER }}

      - name: Terraform Apply
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve -input=false tfplan
        working-directory: ./modules/${{ env.LAYER }}

      - name: Summary
        if: success()
        run: |
          echo "### ✅ ${{ env.LAYER }} Layer Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "- **State:** \`datalake/${{ env.LAYER }}/terraform.tfstate\`" >> $GITHUB_STEP_SUMMARY
